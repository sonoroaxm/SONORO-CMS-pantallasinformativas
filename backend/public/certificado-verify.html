<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar certificado — SONORO</title>
<link rel="icon" href="/sonoro-icon.svg">
<style>
  :root { --bg:#f5f1e8; --ink:#0f0f0f; --muted:#666; --ok:#15803d; --bad:#991b1b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
  header{padding:20px 24px;border-bottom:1px solid #e8e3d6;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .lang-select{background:#fff;border:1px solid #d8d0bc;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink);cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:48px 20px}
  .status{background:#fff;border-radius:12px;padding:36px 28px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
  .badge{display:inline-block;padding:8px 16px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:20px}
  .badge-ok{background:#dcfce7;color:var(--ok)}
  .badge-bad{background:#fee2e2;color:var(--bad)}
  .big{font-size:22px;font-weight:800;margin:0 0 8px}
  .meta{margin-top:28px;border-top:1px solid #f0ebe0;padding-top:20px;text-align:left}
  .meta-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;gap:12px}
  .meta-row span:first-child{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600}
  .link{display:inline-block;margin-top:24px;color:var(--ink);text-decoration:underline;font-size:14px}
  .loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">SONORO · Verificación</h1>
  <select id="lang" class="lang-select" aria-label="Idioma / Language">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
  </select>
</header>
<main id="main">
  <div class="loading" data-i18n="loading">Verificando...</div>
</main>
<script>
const L = {
  es: {
    title: 'SONORO · Verificación',
    loading: 'Verificando...',
    notFoundBadge: 'No encontrado',
    notFoundTitle: 'Certificado no válido',
    notFoundMsg: 'El código QR o enlace no corresponde a un certificado emitido.',
    valid: 'Válido', revoked: 'Revocado',
    verifiedTitle: 'Certificado verificado',
    revokedTitle: 'Certificado revocado',
    verifiedMsg: 'Este certificado fue emitido por SONORO y es auténtico.',
    revokedMsg: 'Este certificado fue revocado por el organizador.',
    reason: 'Motivo',
    attendee: 'Asistente', event: 'Evento', session: 'Sesión',
    hours: 'Horas', issued: 'Emitido',
    viewCert: 'Ver certificado',
    netErr: 'Error de red. Intenta nuevamente.',
    dateLoc: 'es-CO',
  },
  en: {
    title: 'SONORO · Verification',
    loading: 'Verifying...',
    notFoundBadge: 'Not found',
    notFoundTitle: 'Invalid certificate',
    notFoundMsg: 'The QR code or link does not match an issued certificate.',
    valid: 'Valid', revoked: 'Revoked',
    verifiedTitle: 'Certificate verified',
    revokedTitle: 'Certificate revoked',
    verifiedMsg: 'This certificate was issued by SONORO and is authentic.',
    revokedMsg: 'This certificate was revoked by the organizer.',
    reason: 'Reason',
    attendee: 'Attendee', event: 'Event', session: 'Session',
    hours: 'Hours', issued: 'Issued',
    viewCert: 'View certificate',
    netErr: 'Network error. Please try again.',
    dateLoc: 'en-US',
  },
  pt: {
    title: 'SONORO · Verificação',
    loading: 'Verificando...',
    notFoundBadge: 'Não encontrado',
    notFoundTitle: 'Certificado inválido',
    notFoundMsg: 'O código QR ou link não corresponde a um certificado emitido.',
    valid: 'Válido', revoked: 'Revogado',
    verifiedTitle: 'Certificado verificado',
    revokedTitle: 'Certificado revogado',
    verifiedMsg: 'Este certificado foi emitido pela SONORO e é autêntico.',
    revokedMsg: 'Este certificado foi revogado pelo organizador.',
    reason: 'Motivo',
    attendee: 'Participante', event: 'Evento', session: 'Sessão',
    hours: 'Horas', issued: 'Emitido',
    viewCert: 'Ver certificado',
    netErr: 'Erro de rede. Tente novamente.',
    dateLoc: 'pt-BR',
  }
};

function detectLang(){
  const q = new URLSearchParams(location.search).get('lang');
  const stored = localStorage.getItem('sonoro_lang_public');
  const nav = (navigator.language || 'es').slice(0,2);
  const pick = (q || stored || nav).toLowerCase();
  return L[pick] ? pick : 'es';
}
let LANG = detectLang();
const t = (k) => (L[LANG][k] ?? k);

function fmtDate(iso){
  if(!iso) return '';
  try { return new Date(iso).toLocaleDateString(L[LANG].dateLoc, { day:'numeric', month:'long', year:'numeric' }); }
  catch(_) { return iso; }
}
function fmtHours(n){
  if(n == null) return '—';
  const num = Number(n);
  if(Math.abs(num - Math.round(num)) < 0.05) return String(Math.round(num));
  return num.toFixed(1).replace('.', LANG === 'en' ? '.' : ',');
}

const main = document.getElementById('main');
const token = location.pathname.split('/').pop();

function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
}

async function verify(){
  try {
    const r = await fetch(`/api/public/certificates/${token}/verify`);
    const d = await r.json();
    if(!r.ok || d.error){
      main.innerHTML = `
        <div class="status">
          <span class="badge badge-bad">${t('notFoundBadge')}</span>
          <p class="big">${t('notFoundTitle')}</p>
          <p style="color:var(--muted);margin:0">${t('notFoundMsg')}</p>
        </div>`;
      return;
    }
    const ok = d.valid;
    const sessionLine = d.session_name
      ? `<div class="meta-row"><span>${t('session')}</span><span>${d.session_name}</span></div>` : '';
    main.innerHTML = `
      <div class="status">
        <span class="badge ${ok ? 'badge-ok' : 'badge-bad'}">${ok ? t('valid') : t('revoked')}</span>
        <p class="big">${ok ? t('verifiedTitle') : t('revokedTitle')}</p>
        <p style="color:var(--muted);margin:0">${ok
          ? t('verifiedMsg')
          : (d.revoke_reason ? `${t('reason')}: ${d.revoke_reason}` : t('revokedMsg'))}</p>
        <div class="meta">
          <div class="meta-row"><span>${t('attendee')}</span><span>${d.attendee_name || ''}</span></div>
          <div class="meta-row"><span>${t('event')}</span><span>${d.event_name || ''}</span></div>
          ${sessionLine}
          <div class="meta-row"><span>${t('hours')}</span><span>${fmtHours(d.hours_total)}</span></div>
          <div class="meta-row"><span>${t('issued')}</span><span>${fmtDate(d.issued_at)}</span></div>
        </div>
        <a class="link" href="/cert/${token}?lang=${LANG}">${t('viewCert')}</a>
      </div>`;
  } catch(err){
    main.innerHTML = `<div class="status"><p>${t('netErr')}</p></div>`;
  }
}

document.getElementById('lang').value = LANG;
document.getElementById('lang').addEventListener('change', (e) => {
  LANG = e.target.value;
  localStorage.setItem('sonoro_lang_public', LANG);
  applyStatic();
  verify();
});
applyStatic();
verify();
</script>
</body>
</html>
