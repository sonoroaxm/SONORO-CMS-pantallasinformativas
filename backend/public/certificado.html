<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — SONORO</title>
<link rel="icon" href="/sonoro-icon.svg">
<style>
  :root { --bg:#f5f1e8; --ink:#0f0f0f; --muted:#666; --accent:#b8975f; --card:#fff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
  header{padding:20px 24px;border-bottom:1px solid #e8e3d6;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink)}
  .lang-select{background:#fff;border:1px solid #d8d0bc;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink);cursor:pointer}
  main{max-width:960px;margin:0 auto;padding:32px 20px}
  .card{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,0.04);margin-bottom:20px}
  .meta-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0ebe0;font-size:14px;gap:12px}
  .meta-row:last-child{border-bottom:none}
  .meta-row span:first-child{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.8px}
  .meta-row span:last-child{color:var(--ink);text-align:right}
  .pdf-frame{width:100%;height:70vh;min-height:500px;border:1px solid #e8e3d6;border-radius:8px;background:#fafafa}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-block;padding:12px 20px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;border:none;cursor:pointer;transition:opacity 0.15s}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-secondary{background:#fff;color:var(--ink);border:1px solid #d8d0bc}
  .btn:hover{opacity:0.85}
  .revoked{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:14px 18px;border-radius:8px;margin-bottom:20px;font-size:14px}
  .loading{text-align:center;padding:60px 20px;color:var(--muted)}
  footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">SONORO · Certificado</h1>
  <select id="lang" class="lang-select" aria-label="Idioma / Language">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
  </select>
</header>
<main id="main">
  <div class="loading" data-i18n="loading">Cargando certificado...</div>
</main>
<footer data-i18n="footer">Verifica la validez escaneando el QR del documento.</footer>
<script>
const L = {
  es: {
    title: 'SONORO · Certificado',
    loading: 'Cargando certificado...',
    footer: 'Verifica la validez escaneando el QR del documento.',
    notFound: 'Certificado no encontrado',
    notFoundMsg: 'El enlace no es válido o fue removido.',
    revoked: 'Este certificado fue revocado.',
    revokedNote: 'Ya no es válido.',
    attendee: 'Asistente', event: 'Evento', session: 'Sesión',
    hours: 'Horas certificadas', issued: 'Emitido',
    download: 'Descargar PDF', openTab: 'Abrir en nueva pestaña', verify: 'Verificar validez',
    error: 'Error cargando el certificado.',
    dateLoc: 'es-CO',
  },
  en: {
    title: 'SONORO · Certificate',
    loading: 'Loading certificate...',
    footer: 'Verify validity by scanning the QR on the document.',
    notFound: 'Certificate not found',
    notFoundMsg: 'The link is invalid or has been removed.',
    revoked: 'This certificate was revoked.',
    revokedNote: 'It is no longer valid.',
    attendee: 'Attendee', event: 'Event', session: 'Session',
    hours: 'Certified hours', issued: 'Issued',
    download: 'Download PDF', openTab: 'Open in new tab', verify: 'Verify validity',
    error: 'Error loading the certificate.',
    dateLoc: 'en-US',
  },
  pt: {
    title: 'SONORO · Certificado',
    loading: 'Carregando certificado...',
    footer: 'Verifique a validade escaneando o QR do documento.',
    notFound: 'Certificado não encontrado',
    notFoundMsg: 'O link é inválido ou foi removido.',
    revoked: 'Este certificado foi revogado.',
    revokedNote: 'Já não é válido.',
    attendee: 'Participante', event: 'Evento', session: 'Sessão',
    hours: 'Horas certificadas', issued: 'Emitido',
    download: 'Baixar PDF', openTab: 'Abrir em nova aba', verify: 'Verificar validade',
    error: 'Erro ao carregar o certificado.',
    dateLoc: 'pt-BR',
  }
};

function detectLang(){
  const q = new URLSearchParams(location.search).get('lang');
  const stored = localStorage.getItem('sonoro_lang_public');
  const nav = (navigator.language || 'es').slice(0,2);
  const pick = (q || stored || nav).toLowerCase();
  return L[pick] ? pick : 'es';
}
let LANG = detectLang();
const t = (k) => (L[LANG][k] ?? k);

function fmtDate(iso){
  if(!iso) return '';
  try { return new Date(iso).toLocaleDateString(L[LANG].dateLoc, { day:'numeric', month:'long', year:'numeric' }); }
  catch(_) { return iso; }
}
function fmtHours(n){
  if(n == null) return '—';
  const num = Number(n);
  if(Math.abs(num - Math.round(num)) < 0.05) return String(Math.round(num));
  return num.toFixed(1).replace('.', LANG === 'en' ? '.' : ',');
}

const main = document.getElementById('main');
const token = location.pathname.split('/').pop();

function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
}

async function load(){
  try {
    const r = await fetch(`/api/public/certificates/${token}`);
    if(!r.ok){
      main.innerHTML = `<div class="card"><h2 style="margin-top:0">${t('notFound')}</h2><p>${t('notFoundMsg')}</p></div>`;
      return;
    }
    const { certificate: c } = await r.json();
    const revoked = c.revoked_at
      ? `<div class="revoked"><strong>${t('revoked')}</strong> ${t('revokedNote')}</div>` : '';
    const sessionLine = c.session_name
      ? `<div class="meta-row"><span>${t('session')}</span><span>${c.session_name}</span></div>` : '';
    const pdfUrl = `/api/public/certificates/${token}/pdf`;
    main.innerHTML = `
      ${revoked}
      <div class="card">
        <div class="meta-row"><span>${t('attendee')}</span><span>${c.attendee_name || ''}</span></div>
        <div class="meta-row"><span>${t('event')}</span><span>${c.event_name || ''}</span></div>
        ${sessionLine}
        <div class="meta-row"><span>${t('hours')}</span><span>${fmtHours(c.hours_total)}</span></div>
        <div class="meta-row"><span>${t('issued')}</span><span>${fmtDate(c.issued_at)}</span></div>
        <div class="actions">
          ${c.has_pdf && !c.revoked_at ? `<a class="btn btn-primary" href="${pdfUrl}" download="certificado-${token}.pdf">${t('download')}</a>` : ''}
          ${c.has_pdf && !c.revoked_at ? `<a class="btn btn-secondary" href="${pdfUrl}" target="_blank">${t('openTab')}</a>` : ''}
          <a class="btn btn-secondary" href="/verify/${token}?lang=${LANG}">${t('verify')}</a>
        </div>
      </div>
      ${c.has_pdf && !c.revoked_at ? `<div class="card"><iframe class="pdf-frame" src="${pdfUrl}"></iframe></div>` : ''}
    `;
  } catch(err){
    main.innerHTML = `<div class="card"><p>${t('error')}</p></div>`;
  }
}

document.getElementById('lang').value = LANG;
document.getElementById('lang').addEventListener('change', (e) => {
  LANG = e.target.value;
  localStorage.setItem('sonoro_lang_public', LANG);
  applyStatic();
  load();
});
applyStatic();
load();
</script>
</body>
</html>
