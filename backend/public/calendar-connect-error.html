<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No pudimos conectar · SONORO</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#0b0f1a; color:#e5e7eb; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:32px; max-width:420px; width:100%; text-align:center; }
  .logo { font-size:14px; letter-spacing:4px; color:#9ca3af; margin-bottom:24px; }
  .x { width:56px; height:56px; border-radius:50%; background:#ef4444; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; }
  h1 { font-size:22px; margin-bottom:12px; font-weight:600; }
  p { color:#9ca3af; font-size:14px; line-height:1.5; margin-bottom:12px; }
  .code { font-family: monospace; font-size:12px; color:#6b7280; background:#1f2937; padding:4px 8px; border-radius:4px; display:inline-block; margin-top:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SONORO</div>
    <div class="x">&times;</div>
    <h1>No pudimos conectar</h1>
    <p>Pedile al productor del evento un nuevo link de conexión e intentalo otra vez.</p>
    <div class="code" id="code"></div>
  </div>
<script>
  var p = new URLSearchParams(location.search);
  var e = p.get('error');
  if (e) document.getElementById('code').textContent = 'código: ' + e;
  else document.getElementById('code').style.display = 'none';
</script>
</body>
</html>
