# Security headers globales — audit S138 (11/06/2026)

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;

# camera=(self): permite getUserMedia desde mismo dominio (QR check-in evento-staff.html)
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# CSP: 'unsafe-inline' necesario (HTML estaticos con JS/CSS inline)
# Valor real: whitelist de dominios para scripts, bloqueo de plugins/frames/base-tag
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.socket.io https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://cms.sonoro.com.co https://formspree.io; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://formspree.io;" always;
